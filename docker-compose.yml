version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: brainsait-postgres
    environment:
      - POSTGRES_DB=brainsait_healthcare
      - POSTGRES_USER=brainsait
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/database-schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - brainsait-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainsait"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: brainsait-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - brainsait-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # N8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: brainsait-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${TIMEZONE:-America/New_York}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=brainsait_healthcare
      - DB_POSTGRESDB_USER=brainsait
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-changeme123}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      # Custom environment variables for workflows
      - BRAINSAIT_VERSION=1.0.0
      - BRAINSAIT_COMPANY=Brainsait Healthcare
      - BRAINSAIT_SUPPORT_EMAIL=support@brainsait.health
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows:ro
      - ./config:/home/node/.n8n/config:ro
    networks:
      - brainsait-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # RabbitMQ Message Queue (optional)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: brainsait-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-brainsait}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-changeme123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - brainsait-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  brainsait-network:
    driver: bridge
